name: Build Volume Image

on:
  workflow_call:
    inputs:
      image:
        description: Image name (volume name)
        type: string
        required: true
      version:
        description: Pinned image version tag
        type: string
        required: true
      file:
        description: Path to the Containerfile
        type: string
        required: true
      context:
        description: Build context path
        type: string
        required: false
        default: volumes
      build-args:
        description: Build args passed to docker build
        type: string
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: ${{ inputs.build-args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ inputs.image }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}/${{ inputs.image }}:latest
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

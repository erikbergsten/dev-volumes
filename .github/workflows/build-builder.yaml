name: Build builder Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "volumes/Containerfile.builder"
      - ".github/workflows/build-builder.yaml"
      - ".github/workflows/build-image.yaml"
  pull_request:
    paths:
      - "volumes/Containerfile.builder"
      - ".github/workflows/build-builder.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  build:
    uses: erikbergsten/dev-volumes/.github/workflows/build-image.yaml@master
    with:
      image: builder
      version: "0.1.0"
      file: volumes/Containerfile.builder

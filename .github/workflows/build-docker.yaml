name: Build docker Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "volumes/Containerfile.docker"
      - ".github/workflows/build-docker.yaml"
      - ".github/workflows/build-image.yaml"
  pull_request:
    paths:
      - "volumes/Containerfile.docker"
      - ".github/workflows/build-docker.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  build:
    uses: erikbergsten/dev-volumes/.github/workflows/build-image.yaml@master
    with:
      image: docker
      version: "29.8.2"
      file: volumes/Containerfile.docker

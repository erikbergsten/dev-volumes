name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  BUILDER_VERSION: "0.1.0"
  NODE_VERSION: "0.1.0"
  PYTHON_VERSION: "0.1.0"
  DOCKER_VERSION: "0.1.0"
  KUBECTL_VERSION: "0.1.0"
  OPENCODE_VERSION: "0.1.0"
  DEV_VERSION: "0.1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for any standard non-compiled steps that need it
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up the modern Buildx builder context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry using the automatic GitHub token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/builder:${{ env.BUILDER_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/builder:latest
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

      - name: Build and push node image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/node:${{ env.NODE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/node:latest
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

      - name: Build and push python image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/python:${{ env.PYTHON_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/python:latest
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/docker:${{ env.DOCKER_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/docker:latest
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker

      - name: Build and push kubectl image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.kubectl
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/kubectl:${{ env.KUBECTL_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/kubectl:latest
          cache-from: type=gha,scope=kubectl
          cache-to: type=gha,mode=max,scope=kubectl

      - name: Build and push opencode image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.opencode
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/opencode:${{ env.OPENCODE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/opencode:latest
          cache-from: type=gha,scope=opencode
          cache-to: type=gha,mode=max,scope=opencode

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: dev
          file: dev/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/dev:${{ env.DEV_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/dev:latest
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

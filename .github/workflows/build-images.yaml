name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase (required for Docker tags)
  IMAGE_REPO: ${{ github.repository }}
  BUILDER_VERSION: "0.1.0"
  NODE_VERSION: "0.1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for any standard non-compiled steps that need it
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up the modern Buildx builder context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry using the automatic GitHub token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build both architectures and push them as a unified 'latest' tag
      - name: Build and push builder image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/builder:${{ env.BUILDER_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build both architectures and push them as a unified 'latest' tag
      - name: Build and push node image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/node:${{ env.NODE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/node:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


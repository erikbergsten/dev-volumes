name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase (required for Docker tags)
  IMAGE_REPO: ${{ github.repository }}
  BUILDER_VERSION: "0.1.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for any standard non-compiled steps that need it
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up the modern Buildx builder context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry using the automatic GitHub token
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pyproject.outputs.VERSION }}
            type=sha,format=short

      # Build both architectures and push them as a unified 'latest' tag
      - name: Build and push builder image
        uses: docker/build-push-action@v6
        with:
          context: volumes
          file: volumes/Containerfile.builder
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/builder:${{ env.BUILDER_VERSION }}
            ${{ env.IMAGE_REPO }}/builder:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


name: Build dev Image

on:
  push:
    branches: [ "master" ]
    paths:
      - "dev/**"
      - ".github/workflows/build-dev.yaml"
      - ".github/workflows/build-image.yaml"
  pull_request:
    paths:
      - "dev/**"
      - ".github/workflows/build-dev.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  build:
    uses: erikbergsten/dev-volumes/.github/workflows/build-image.yaml@master
    with:
      image: dev
      version: "0.1.0"
      file: dev/Containerfile
      context: dev
